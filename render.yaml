services:
  # Next.js Frontend
  - type: web
    name: jd-resume-frontend
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SITE_PASSWORD
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: jd-resume-backend
          type: web
          property: host

  # FastAPI Backend
  - type: web
    name: jd-resume-backend
    env: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
